<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPOSTER (Besser als ChatGPT)</title>
    <style>
        html {
            background-color: #1e1e1e;
        }
        body {
            background-color: #2e2e2e;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            margin: 5px;
            border-radius: 10px;
            border: 1px solid #333;
        }
        #main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        h1 {
            text-align: center;
            animation: changeColor 120s;
        }
        button {
            outline: none;
            border: none;
            background-color: #3e3e3e;
            color: white;
            transition: 0.5s;
            font-size: 50px;
            border-radius: 15px;
            padding: 5px;
        }
        button:hover {
            background-color: #4e4e4e;
            transform: rotate(-2.5deg);
        }
        input {
            margin: 5px;
            border-radius: 8px;
            outline: none;
            padding: 5px;
        }
        select {
            padding: 5px;
            margin: 5px;
            border-radius: 8px;
            color: white;
            background-color: #464646;
            outline: none;
        }
        @keyframes changeColor {
            0% {
                color: #ffffff;
            }
            50% {
                color: #ff0000;
            }
            100% {
                color: #ffffff;
            }
        }
    </style>
</head>
<body>
    <h1>IMPOSTER</h1>
    <div id="main"><button onclick="startGame()">Start</button></div>
    </div>
    <div id="pointsList">
    <script>
        const main = document.getElementById('main');
        const pointsList = document.getElementById('pointsList');

        let points = {};
        let names = [];
        let validNames = false;
        let gamemode = false;
        let round = 0;
        let imposter = '';
        let word = '';
        let imposterWord = '';
        let telePromter = '';
        let votes = {};
        let voted = 0;

        const words = {
            "tiere": {
                "1":{
                    "crew": "Affe",
                    "imposter": "Banane",
                },
                "2":{
                    "crew": "Kameleon",
                    "imposter": "Umkleide",
                },
                "3":{
                    "crew": "Godzilla",
                    "imposter": "Sausia Grrrrr",
                },
                "4":{
                    "crew": "Hund",
                    "imposter": "Sohn",
                },
                "5":{
                    "crew": "Ameise",
                    "imposter": "klein",
                },
            },
            "gegenstände": {
                "1":{
                    "crew": "Karton",
                    "imposter": "IKEA",
                },
                "2":{
                    "crew": "Nuklearer Atom Spreng Kopf Zündungs Fernbedienungs Anlagen Bedien Ausbildung",
                    "imposter": "N-A-S-K-Z-F-A-B-A",
                },
                "3":{
                    "crew": "Jupiter",
                    "imposter": "Gleich viel Masse wie deine Mutter",
                },
                "4":{
                    "crew": "Schrödingers Katze Box",
                    "imposter": "Tot und Nicht Tot",
                },
                "5":{
                    "crew": "U-Boot",
                    "imposter": "Glug Glug Glug",
                },
            }
        }

        function startGame(){
            if(validNames === false){
                main.innerHTML = '<span>Schreibe die Namen aller Spieler getrennt durch ein Komma hier rein: </span><br><input id="PlayersInput"><button onclick="checkBefor()">Bestätigen</button>';
            } else if(gamemode === false && validNames === true){
                main.innerHTML = `<span>Wähle eine Kategorie: </span><br><select id="typeGamemode">
                    <option value="tiere">Tiere</option>
                    <option value="gegenstände">Gegenstände</option>
            </select><button onclick="checkBefor()">Bestätigen</button>`;
            }
        }

        function checkBefor(){
            imposter = '';
            if(validNames === false){
                names = document.getElementById('PlayersInput').value.trim();
                names = names.split(',');
                console.log(names);
                validNames = true;
                if(round === 0){
                    names.forEach(e => {
                        points[e] = 0;
                    });
                }
                startGame();
            } else if(gamemode === false){
                const typeGamemode = document.getElementById('typeGamemode');
                gamemode = typeGamemode.value;
                igniteGame();
            }
        }

        function random(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function igniteGame(){
            round++;
            alert('Runde ' + round);
            let wert = random(1, 5);
            console.log('wert: ' + wert + ' || gamemode: ' + gamemode);
            console.log(words[gamemode][wert]);
            word = words[gamemode][wert].crew;
            imposterWord = words[gamemode][wert].imposter;
            
            let person = names[random(0, names.length - 1)]; 
            imposter = person;
            
            telePromter = '';
            names.forEach((e) => {
                if(imposter === e){
                    telePromter = telePromter + `<b style="cursor: pointer" title="Imposter - ${imposterWord}">${e}</b><br>`;
                } else {
                    telePromter = telePromter + `<b style="cursor: pointer" title="Crewmate - ${word}">${e}</b><br>`;
                }
            });
            main.innerHTML = `<h2>Wer ist der Imposter?</h2><br><h4>Fahre den Cursor über deinen Spieler Namen und sieh ob du Imposter oder Crewmate bist und Merke dir das Word</h4>${telePromter}<br><button onclick="startRound()">Runde Starten</button>`;
        }

        function startRound(){
            let minuten = 0;
            let sekunden = 5;

            main.innerHTML = `<h2>${minuten}:${sekunden < 10 ? '0' : ''}${sekunden}</h2>`;

            let inter = setInterval(() => {
                if (sekunden === 0 && minuten > 0) {
                    sekunden = 59;
                    minuten--;
                } 
                else if (sekunden > 0) {
                    sekunden--;
                } 
                else {
                    main.innerHTML = `<h2>Zeit abgelaufen</h2>`;
                    clearInterval(inter);
                    vote();
                    return;
                }

                main.innerHTML = `<h2>${minuten}:${sekunden < 10 ? '0' : ''}${sekunden}</h2>`;
            }, 1000);
        }

        function vote(){
            votes = {};
            voted = 0;
            telePromter = '';
            names.forEach(e => {
                votes[e] = 0;
                telePromter = telePromter + `<button onclick="voteFor('${e}')">${e}</button><br>`;
            });
            main.innerHTML = `<h3>Wer war der Imposter, jeder klickt <b>einmal</b> auf den Knopf um zu voten</h3><br>${telePromter}`;
            
        }

        function voteFor(mate){
            votes[mate]++;
            voted++;
            afterVote();
        }

        function afterVote(){
            telePromter = '';
            names.forEach(e => {
                if(votes[e] > 0){
                    telePromter = telePromter + `<b>${e}</b><span> mit ${votes[e]} Stimmen</span>`;
                }
            });
            if(voted === names.length){
                main.innerHTML = `<h2>Voting beendet</h2><br><span>Gevotet wurde gegen:</span><br>${telePromter}<br><button onclick="ShowImposter()">Imposter Aufdecken</button>`;
            }
            if(votes[imposter] >= names.length/2){
                names.forEach(e => {
                    if(imposter !== e){
                        points[e] = points[e] + 250;
                        points[imposter] = points[imposter] - 50;
                    }
                });
            }
        }

        function ShowImposter(){
            main.innerHTML = `<h2>Voting beendet</h2><br><span>Imposter ist: <b>${imposter}</b>... Imposter, was war das Word</span><input id="imposterCheck"><button onclick="checkImposterWord()">Prüfen</button>`;
        }

        function checkImposterWord(){
            let theGuess = document.getElementById('imposterCheck').value
            if(word.toLocaleLowerCase() === theGuess.toLowerCase()){
                main.innerHTML = '<h2>Imposter lag richtig<h2><button onclick="startGame()">Neue Runde</button>';
                points[imposter] = points[imposter] + 500;
            } else {
                main.innerHTML = '<h2>Imposter lag Falsch<h2><button onclick="startGame()">Neue Runde</button>';
                names.forEach(e => {
                    if(imposter !== e){
                        points[e] = points[e] + 250;
                        points[imposter] = points[imposter] - 50;
                    }
                });
            }
            updatePoints();
        }

        function updatePoints(){
            telePromter = '';
            names.forEach(e => {
                telePromter = telePromter + `${e}: ${points[e]}\n`;
            });
            pointsList.innerText = telePromter;
        }
    </script>
</body>
</html>
